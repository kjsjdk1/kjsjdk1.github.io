<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>제41회 삼남비과포럼 채점 집계</title>
<style>
  :root{ --bg:#f4f5f7; --card:#fff; --line:#e3e6ea; --ink:#1a1d21; --sub:#6b7280;
         --accent:#1f5faa; --ok:#16794c; --warn:#b45309; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    font-size:14px; line-height:1.5;}
  header{background:var(--accent); color:#fff; padding:14px 16px; display:flex;
         align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  header h1{margin:0; font-size:17px; font-weight:700;}
  header p{margin:4px 0 0; font-size:12px; opacity:.85;}
  #live{font-size:12px; background:rgba(255,255,255,.16); padding:6px 12px; border-radius:99px;
        white-space:nowrap; font-weight:600;}
  #live .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#7ee2a8;
             margin-right:6px; vertical-align:-1px;}
  #live.off .dot{background:#f0b7b7;}
  .wrap{max-width:1150px; margin:0 auto; padding:14px 12px 60px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;}
  .card h2{margin:0 0 8px; font-size:15px;}
  .card p.hint{margin:0 0 10px; font-size:12.5px; color:var(--sub);}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  button{padding:10px 16px; border:none; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer;}
  .primary{background:var(--accent); color:#fff;}
  .ghost{background:#eef1f4; color:#374151;}
  .green{background:var(--ok); color:#fff;}
  textarea{width:100%; height:110px; border:1px solid var(--line); border-radius:10px; margin-top:8px;
    padding:10px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; background:#fafbfc;}
  details summary{font-size:13px; font-weight:700; color:var(--sub); cursor:pointer;}

  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:118px; background:#fafbfc;}
  .chip .nm{font-weight:800; font-size:13.5px;}
  .chip .st{font-size:11.5px; margin-top:2px; color:#9ca3af; font-weight:600;}
  .chip.in{background:#eaf6ef; border-color:#bfe3d0;}
  .chip.in .st{color:#116e45;}

  .tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; width:100%; min-width:900px; font-size:13px; background:#fff;}
  th,td{border:1px solid var(--line); padding:7px 8px;}
  th{background:#e8eef7; font-weight:700; text-align:center; white-space:nowrap;}
  td.c{text-align:center;}
  td.title{min-width:290px; word-break:keep-all;}
  td.who{color:var(--sub); font-size:12px; white-space:nowrap;}
  td.tot{font-weight:800; background:#f7f9fc;}
  tr.r1 td{background:#fff7dc !important;}
  tr.r2 td{background:#eef1f6 !important;}
  tr.r3 td{background:#f9ece0 !important;}
  tr.r4 td{background:#eaf4ea !important;}
  td.rank{font-weight:800; white-space:nowrap;}
  .rb{display:inline-block; min-width:26px; padding:3px 7px; border-radius:99px;
      color:#fff; font-weight:800; font-size:12.5px; line-height:1.3;}
  .rb1{background:#c99700;} .rb2{background:#7f8b9c;}
  .rb3{background:#a96f45;} .rb4{background:#4f8055;}
  .rbx{color:#c7ccd3; font-weight:700;}
  .legend span{display:inline-block; margin-right:12px;}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px;
            vertical-align:-1px; margin-right:4px;}
  .sesrow td{background:#dde6f2 !important; font-weight:700; color:#173c68; font-size:12.5px;}
  .empty{color:#c7ccd3;}
  .det{font-size:10.5px; color:#9ca3af; display:block;}
  @media print{
    header,.card,#tools{display:none !important;}
    body{background:#fff;} .wrap{padding:0;} table{min-width:0; font-size:11px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>제41회 삼남비과포럼 자유연제 채점 집계</h1>
    <p>심사위원 제출 즉시 자동 반영 · 연제별 합계 / 평균 / 순위</p>
  </div>
  <div id="live"><span class="dot"></span><span id="liveTxt">연결 중…</span></div>
</header>

<div class="wrap">

<div class="card">
  <h2>제출 현황</h2>
  <div class="chips" id="chips"></div>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="refreshBtn">지금 새로고침</button>
    <button class="ghost" id="autoBtn">자동 새로고침 끄기</button>
    <button class="green" id="tsvBtn">표 복사 (엑셀)</button>
    <button class="ghost" id="detBtn">항목별 상세 보기</button>
    <button class="ghost" id="printBtn">인쇄 / PDF</button>
  </div>
</div>

<div class="card" id="tools">
  <details>
    <summary>백업 입력 — 심사위원이 카톡으로 보낸 결과코드 붙여넣기</summary>
    <p class="hint" style="margin-top:8px">
      통신 문제로 자동 전송이 안 된 심사위원의 코드를 여기에 붙여넣으십시오.
      카톡 대화를 통째로 붙여넣어도 <code>SNB41-J…</code> 코드만 골라냅니다.
      <b>자동 전송으로 이미 들어온 심사위원은 자동 전송분이 우선</b>합니다.
    </p>
    <textarea id="inp" placeholder="여기에 붙여넣기…"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="calcBtn">반영하기</button>
      <button class="ghost" id="clearBtn">지우기</button>
    </div>
  </details>
</div>

<div class="tblwrap"><table id="tbl"></table></div>

</div>

<script>
var JUDGES = ["김용민","정한진","허성재","남정권","조재훈"];
var CRIT = ["①독창성","②발표·자료","③임상유용"];
var ALPHA = "0123456789A";
var KEY = "snb41_sum_v2";
var TOPIC = "snb41-k7d92mq4xv3b";                 // 채점 페이지와 동일해야 함
var FEED = "https://ntfy.sh/" + TOPIC + "/json?poll=1&since=all";
var POLL_MS = 8000;

var TALKS = [
 {s:1,n:1,t:"부비동 내시경 수술을 시행한 소아 만성 부비동염 환자 2예",w:"단국대병원 문민석"},
 {s:1,n:2,t:"Nostril Stenosis Following Herpes Zoster Infection: A Case Report",w:"조선대병원 Abdullah M Aldosari"},
 {s:1,n:3,t:"Repair of Nostril Stenosis: Case Series",w:"닥터진 이비인후과 진홍률"},
 {s:1,n:4,t:"좌측 안면부 부종과 비배부의 화농성 분비물을 주소로 내원한 78세 여성 환자",w:"메리놀병원 박체현"},
 {s:1,n:5,t:"비배부 이물과 관련된 지연성 염증 반응",w:"양산부산대병원 최재혁"},
 {s:1,n:6,t:"비골 골절 폐쇄정복술에서 초음파의 활용: 증례 3예",w:"원주세브란스기독병원 전현종"},
 {s:1,n:7,t:"Partial Epiglottectomy Restored Long-Term Noninvasive Ventilation Responsiveness…",w:"전남대병원 김환민"},
 {s:1,n:8,t:"양측 눈물샘 비대 및 안구 돌출을 동반한 난치성 범부비동염 1예",w:"건양대병원 김익희"},
 {s:2,n:9,t:"Both Nasal Obstruction를 주소로 내원한 67세 남환 1예",w:"대전성모병원 이현석"},
 {s:2,n:10,t:"좌측 하안검 종물을 주소로 내원한 63세 남자",w:"삼성창원병원 이민주"},
 {s:2,n:11,t:"조기 국소 재발한 비강 점막 악성 흑색종 1예",w:"동아대병원 서민호"},
 {s:2,n:12,t:"Wide Excision and Staged Reconstruction Using a Paramedian Forehead Flap…",w:"고신대복음병원 최종현"},
 {s:2,n:13,t:"부비동내시경수술과 구개회전피판술을 이용한 Oroantral Fistula 치험 1예",w:"BS숨이비인후과 김무건"},
 {s:2,n:14,t:"뇌 MRI 상 이상소견으로 의뢰된 32세 남자",w:"해운대백병원 서태경"},
 {s:2,n:15,t:"안면 통증을 주소로 내원한 78세 여자",w:"창원경상국립대병원 차현철"},
 {s:2,n:16,t:"ANCA-Negative Destructive Sinonasal Lesion and Upper Airway Narrowing…",w:"부산대병원 김숙진"}
];
var SESNAME = {1:"Session 1 (14:30-15:50) · 좌장 인제대 해운대백병원 김용완",
               2:"Session 2 (16:10-17:30) · 좌장 BS 숨이비인후과 노환중"};

function csum(s){
  var t=0; for(var i=0;i<s.length;i++){ t=(t*31+s.charCodeAt(i))%1296; }
  var r=t.toString(36).toUpperCase(); return r.length<2 ? "0"+r : r;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hhmm(ms){
  var d=new Date(ms), h=d.getHours(), m=d.getMinutes();
  return (h<12?"오전 ":"오후 ") + ((h%12)||12) + ":" + (m<10?"0":"") + m;
}

var CODE_RE = /SNB41[-\s]*J\s*([1-5])\s*[-\s]\s*([0-9Aa]{48})\s*[-\s]\s*([0-9A-Za-z]{2})/g;

function extract(text){          // → {judge: scores[48]}
  CODE_RE.lastIndex = 0;
  var out = {}, m;
  while((m = CODE_RE.exec(text)) !== null){
    var body = m[2].toUpperCase();
    if(csum(body) !== m[3].toUpperCase()) continue;
    var arr = [];
    for(var i=0;i<48;i++){ arr.push(ALPHA.indexOf(body.charAt(i))); }
    out[parseInt(m[1],10)] = arr;
  }
  return out;
}

var live = {};       // judge → {sc:[], at:ms}
var manual = {};     // judge → sc[]
var auto = true, lastOk = 0, showDet = false, lastData = null;

function pull(){
  fetch(FEED + "&_=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(txt){
      var next = {};
      txt.split("\n").forEach(function(line){
        if(!line.trim()) return;
        var o; try{ o = JSON.parse(line); }catch(e){ return; }
        if(o.event !== "message" || !o.message) return;
        var got = extract(o.message);
        for(var j in got){ next[j] = {sc:got[j], at:(o.time||0)*1000}; }   // 뒤 = 최신
      });
      live = next; lastOk = Date.now();
      setLive(true, "실시간 연결됨 · " + hhmm(lastOk) + " 갱신");
      render();
    })
    .catch(function(){
      setLive(false, lastOk ? "연결 끊김 · 마지막 " + hhmm(lastOk) : "연결 실패");
    });
}
function setLive(on, txt){
  document.getElementById("live").className = on ? "" : "off";
  document.getElementById("liveTxt").textContent = txt;
}

function merged(){
  var out = {};
  for(var j=1;j<=5;j++){
    if(live[j]) out[j] = {sc:live[j].sc, at:live[j].at, src:"auto"};
    else if(manual[j]) out[j] = {sc:manual[j], at:0, src:"manual"};
  }
  return out;
}

function render(){
  var mg = merged();
  var present = [];
  for(var j=1;j<=5;j++){ if(mg[j]) present.push(j); }

  // 제출 현황
  var ch = "";
  for(var j=1;j<=5;j++){
    var g = mg[j];
    var tot = g ? g.sc.reduce(function(a,b){return a+b;},0) : 0;
    var full = 0;
    if(g){ for(var i=0;i<16;i++){ if(g.sc[i*3] && g.sc[i*3+1] && g.sc[i*3+2]) full++; } }
    ch += "<div class='chip " + (g ? "in" : "") + "'><div class='nm'>" + esc(JUDGES[j-1]) + "</div>" +
      "<div class='st'>" + (g
        ? (g.src === "auto" ? hhmm(g.at) + " 제출" : "수동 입력") + " · " + full + "/16 · " + tot + "점"
        : "미제출") + "</div></div>";
  }
  document.getElementById("chips").innerHTML = ch;

  // 연제별
  var rows = TALKS.map(function(tk, idx){
    var per = [], det = [];
    for(var j=1;j<=5;j++){
      if(!mg[j]){ per.push(null); det.push(null); continue; }
      var a = mg[j].sc, x = a[idx*3], y = a[idx*3+1], z = a[idx*3+2];
      per.push(x+y+z); det.push([x,y,z]);
    }
    var vals = per.filter(function(v){ return v !== null; });
    var tot = vals.reduce(function(a,b){ return a+b; }, 0);
    return {tk:tk, per:per, det:det, tot:tot, avg:(vals.length ? tot/vals.length : 0)};
  });
  var sorted = rows.slice().sort(function(a,b){ return b.tot - a.tot; });
  rows.forEach(function(r){
    r.rank = r.tot > 0 ? (sorted.findIndex(function(x){ return x.tot === r.tot; }) + 1) : 0;
  });
  lastData = {rows:rows, present:present};

  var h = "<thead><tr><th>연제</th><th>제목</th><th>발표</th><th>순위</th>";
  for(var j=1;j<=5;j++){
    h += "<th>" + esc(JUDGES[j-1]) +
      (present.indexOf(j) < 0 ? "<br><span style='font-weight:400;font-size:11px;color:#9ca3af'>미제출</span>" : "") +
      "</th>";
  }
  h += "<th>합계</th><th>평균</th></tr></thead><tbody>";
  var curSes = 0;
  rows.forEach(function(r){
    if(r.tk.s !== curSes){
      curSes = r.tk.s;
      h += "<tr class='sesrow'><td colspan='11'>" + esc(SESNAME[curSes]) + "</td></tr>";
    }
    var cls = (r.rank >= 1 && r.rank <= 4) ? "r" + r.rank : "";
    var badge = (r.rank >= 1 && r.rank <= 4)
      ? "<span class='rb rb" + r.rank + "'>" + r.rank + "</span>"
      : "<span class='rbx'>" + (r.rank || "-") + "</span>";
    h += "<tr class='" + cls + "'><td class='c'><b>" + r.tk.n + "</b></td>" +
         "<td class='title'>" + esc(r.tk.t) + "</td><td class='who'>" + esc(r.tk.w) + "</td>" +
         "<td class='c rank'>" + badge + "</td>";
    r.per.forEach(function(v, k){
      if(v === null){ h += "<td class='c'><span class='empty'>·</span></td>"; return; }
      h += "<td class='c'>" + v +
           (showDet ? "<span class='det'>" + r.det[k].join(" / ") + "</span>" : "") + "</td>";
    });
    h += "<td class='c tot'>" + r.tot + "</td><td class='c'>" +
         (r.avg ? r.avg.toFixed(1) : "-") + "</td></tr>";
  });
  h += "</tbody><tfoot><tr><td colspan='11' class='legend' style='font-size:12px;color:#6b7280;background:#fafbfc'>" +
       "연제당 만점 30점(3개 항목 × 10점) · 제출 " + present.length + "명 기준 만점 " +
       (present.length*30) + "점<br>" +
       "<span><i style='background:#fff7dc;border:1px solid #c99700'></i>1위</span>" +
       "<span><i style='background:#eef1f6;border:1px solid #7f8b9c'></i>2위</span>" +
       "<span><i style='background:#f9ece0;border:1px solid #a96f45'></i>3위</span>" +
       "<span><i style='background:#eaf4ea;border:1px solid #4f8055'></i>4위</span>" +
       "<span>동점은 같은 순위</span>" +
       (showDet ? "<span>작은 숫자 = " + CRIT.join(" / ") + "</span>" : "") +
       "</td></tr></tfoot>";
  document.getElementById("tbl").innerHTML = h;
}

/* 컨트롤 */
document.getElementById("refreshBtn").onclick = pull;
document.getElementById("autoBtn").onclick = function(){
  auto = !auto;
  this.textContent = auto ? "자동 새로고침 끄기" : "자동 새로고침 켜기";
  if(auto) pull();
};
document.getElementById("detBtn").onclick = function(){
  showDet = !showDet;
  this.textContent = showDet ? "항목별 상세 숨기기" : "항목별 상세 보기";
  render();
};
document.getElementById("printBtn").onclick = function(){ window.print(); };
document.getElementById("calcBtn").onclick = function(){
  var txt = document.getElementById("inp").value;
  try{ localStorage.setItem(KEY, txt); }catch(e){}
  manual = extract(txt);
  render();
  var n = Object.keys(manual).length;
  alert(n ? n + "명의 결과코드를 반영했습니다." : "인식된 결과코드가 없습니다. 코드가 잘리지 않았는지 확인해 주십시오.");
};
document.getElementById("clearBtn").onclick = function(){
  document.getElementById("inp").value = "";
  manual = {};
  try{ localStorage.removeItem(KEY); }catch(e){}
  render();
};
document.getElementById("tsvBtn").onclick = function(){
  if(!lastData){ return; }
  var lines = [], head = ["연제","제목","발표","순위"].concat(JUDGES).concat(["합계","평균"]);
  lines.push(head.join("\t"));
  lastData.rows.forEach(function(r){
    var c = [r.tk.n, r.tk.t, r.tk.w, r.rank || ""];
    r.per.forEach(function(v){ c.push(v === null ? "" : v); });
    c.push(r.tot, r.avg ? r.avg.toFixed(1) : "");
    lines.push(c.join("\t"));
  });
  var tsv = lines.join("\n");
  var ta = document.createElement("textarea");
  ta.value = tsv; document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, 999999);
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(tsv); ok = true; }
  alert(ok ? "표를 복사했습니다. 엑셀에 붙여넣으십시오." : "복사에 실패했습니다.");
};

try{
  var saved = localStorage.getItem(KEY);
  if(saved){ document.getElementById("inp").value = saved; manual = extract(saved); }
}catch(e){}

render();
pull();
setInterval(function(){ if(auto) pull(); }, POLL_MS);
</script>
</body>
</html>
